<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>此间 · 解压一会儿</title><style>/* POND_CSS */</style></head><body>
<main id="pond" aria-label="浅水庭院"><canvas id="water" tabindex="0" aria-label="轻触或拖动水面泛起涟漪，也可以只是看看"></canvas><svg id="follow-guide" aria-hidden="true"><defs><radialGradient id="guide-light"><stop offset="0%" stop-color="#f7ffdd" stop-opacity="0"/><stop offset="55%" stop-color="#f7ffdd" stop-opacity=".06"/><stop offset="64%" stop-color="#f7ffdd" stop-opacity=".45"/><stop offset="100%" stop-color="#f7ffdd" stop-opacity="0"/></radialGradient></defs><g id="follow-near"><circle class="guide-bloom" r="25" fill="url(#guide-light)"/><circle class="guide-shadow" r="15"/><circle class="guide-core" r="15"/><circle class="guide-soft" r="19"/></g><g id="follow-far"><circle class="guide-bloom" r="25" fill="url(#guide-light)"/><circle class="guide-shadow" r="15"/><circle class="guide-core" r="15"/><circle class="guide-soft" r="19"/></g></svg><div id="touch-feedback" aria-hidden="true"></div></main>
<header><button id="back" type="button"><span aria-hidden="true">←</span> <span data-word="back">返回首页</span></button><h1 data-word="title">解压一会儿</h1><button id="settings" type="button" aria-expanded="false" aria-controls="options" data-word="settings">设置</button></header>
<div id="loading" role="status" data-word="loading">正在走近水边…</div>
<div id="failed" hidden role="alert"><p data-word="failed">水庭暂时无法打开，请重试。</p><button id="retry" data-word="retry">重新打开</button></div>
<p id="invitation" data-word="hint">轻轻拨水，也可以只是看看。</p>
<button id="follow-sound" type="button" hidden>开启跟随水声</button>
<footer class="presence-dock"><button id="sound" class="presence-control" type="button" aria-haspopup="dialog"><span aria-hidden="true">♫</span><span id="sound-label">声音已关</span><span class="sound-chevron" aria-hidden="true">⌄</span></button><button id="pause" class="presence-express" type="button" aria-pressed="false">暂停</button></footer>
<dialog id="sound-dialog" aria-labelledby="sound-title"><h2 id="sound-title" data-word="soundTitle">听见安静</h2><p class="sound-intro" data-word="soundIntro">选一种水声，也给安静留一点位置。</p><div class="sound-choices"><button class="sound-choice" data-preset="drop" aria-pressed="true"><span class="sound-symbol" aria-hidden="true">◌</span><span><strong data-word="dropName">轻拨水面</strong><small data-word="dropHint">一点轻柔水声，缓缓散开。</small></span><span class="sound-selected" aria-hidden="true">✓</span></button><button class="sound-choice" data-preset="lap" aria-pressed="false"><span class="sound-symbol" aria-hidden="true">◡</span><span><strong data-word="lapName">水波荡漾</strong><small data-word="lapHint">听水轻轻拍岸，缓缓流动。</small></span><span class="sound-selected" aria-hidden="true">✓</span></button></div><div class="setting-row sound-level"><label for="volume" data-word="volume">音量</label><input id="volume" type="range" min="0" max="0.3" step="0.01" value="0.16"></div><p class="sound-footnote" data-word="soundHint">由你开启，暂停或离开时停止。</p><div class="dialog-actions"><button id="sound-close" class="secondary-button" data-word="done">好了</button><button id="sound-play" class="primary-button">开启声音</button></div></dialog>
<section id="options" hidden aria-label="水庭设置"><label><span data-word="surprises">偶遇小惊喜</span><input id="surprises" type="checkbox" checked></label><label><span data-word="still">静止画面</span><input id="still" type="checkbox"></label><p data-word="soundHint">声音由你开启，暂停或离开时停止。</p><button id="close-options" data-word="done">好了</button></section>
<p id="status" role="status" aria-live="polite"></p>
<script>/* POND_SCRIPT */</script></body></html>
